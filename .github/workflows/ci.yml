name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - milestone-*

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install firebase-tools
        # Pinned in .firebase-tools-version so the cloud setup script and CI cannot
        # drift apart. scripts/test/firebase-tools-pin.test.mjs asserts they match.
        run: npm install -g "firebase-tools@$(cat .firebase-tools-version)"

      - name: Cache emulator jars
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('.firebase-tools-version') }}
          restore-keys: |
            firebase-emulators-

      - name: Install Playwright Chromium
        run: npm exec --workspace site -- playwright install --with-deps chromium

      - name: Test shared
        run: npm test --workspace shared

      - name: Test functions
        run: npm test --workspace functions

      - name: Test site
        run: npm test --workspace site

      - name: Test admin
        run: npm test --workspace admin

      - name: Test rules
        run: npm test --workspace rules-tests

      - name: Test scripts
        run: npm run test:scripts

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/test-results/
            **/playwright-report/
